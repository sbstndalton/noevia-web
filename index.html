<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>noevia</title>
    <meta name="application-name" content="noevia" />
    <meta name="description" content="noevia — a focused space for conversation, journaling, and code." />
    <meta name="theme-color" content="#151519" />
    <!-- Start the sign-in checks while the app bundle downloads; AuthGate's
         same-origin fetches pick these responses up instead of waiting. -->
    <link rel="preload" href="/api/setup/status" as="fetch" crossorigin />
    <link rel="preload" href="/api/auth/session" as="fetch" crossorigin />
    <script src="/theme.js"></script>
    <script src="/layout-mode.js"></script>
    <script defer src="/lens.js"></script>
    <script defer src="/glass-highlight.js"></script>
    <script defer src="/viewport.js"></script>
    <script defer src="/fonts.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
