<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>noevia</title>
    <meta name="application-name" content="noevia" />
    <meta name="description" content="noevia — a focused space for conversation, journaling, and code." />
    <!-- Light and dark get their own colour so the browser chrome matches the page. -->
    <meta name="theme-color" content="#f7f6fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151519" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="noevia" />
    <!-- Start the sign-in checks while the app bundle downloads; AuthGate's
         same-origin fetches pick these responses up instead of waiting. -->
    <link rel="preload" href="/api/setup/status" as="fetch" crossorigin />
    <link rel="preload" href="/api/auth/session" as="fetch" crossorigin />
    <script src="/theme.js"></script>
    <script src="/layout-mode.js"></script>
    <script defer src="/lens.js"></script>
    <script defer src="/glass-highlight.js"></script>
    <script defer src="/viewport.js?v=3"></script>
    <script defer src="/fonts.js?v=3"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
